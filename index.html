<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yuta's Links</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;

        padding: 24px;

        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;

        color: #fafafa;
        background: #0f0f0f;
      }

      main {
        width: 100%;
        max-width: 520px;

        padding: 28px;

        background: #181818;
        border: 1px solid #2a2a2a;
        border-radius: 20px;
      }

      header {
        margin-bottom: 28px;
      }

      h1 {
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .description {
        margin-top: 6px;
        color: #a1a1aa;
        font-size: 0.95rem;
      }

      section + section {
        margin-top: 28px;
      }

      h2 {
        margin-bottom: 10px;

        color: #a1a1aa;
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .links {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .link {
        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 14px 16px;

        color: inherit;
        background: #222222;
        border: 1px solid #303030;
        border-radius: 12px;

        text-decoration: none;

        transition:
          background-color 0.15s ease,
          border-color 0.15s ease,
          transform 0.15s ease;
      }

      .link:hover {
        background: #292929;
        border-color: #404040;
        transform: translateY(-1px);
      }

      .link-name {
        font-weight: 600;
      }

      .username {
        color: #a1a1aa;
        font-size: 0.9rem;
      }

      .arrow {
        color: #71717a;
      }

      .discord-account {
        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 14px 16px;

        background: #222222;
        border: 1px solid #303030;
        border-radius: 12px;
      }

      .copy {
        padding: 6px 10px;

        color: #a1a1aa;
        background: transparent;
        border: 1px solid #404040;
        border-radius: 7px;

        font: inherit;
        font-size: 0.8rem;
        cursor: pointer;

        transition:
          color 0.15s ease,
          background-color 0.15s ease;
      }

      .copy:hover {
        color: #fafafa;
        background: #303030;
      }

      @media (max-width: 560px) {
        body {
          padding: 16px;
        }

        main {
          padding: 22px;
          border-radius: 16px;
        }
      }
    </style>
  </head>

  <body>
    <main>
      <header>
        <h1>Yuta</h1>
        <p class="description">Links to my accounts around the web.</p>
      </header>

      <section>
        <h2>Social</h2>

        <div class="links">
          <a class="link" href="https://x.com/yuta256dev">
            <div>
              <div class="link-name">X</div>
              <div class="username">@yuta256dev</div>
            </div>

            <span class="arrow">↗</span>
          </a>

          <a class="link" href="https://bsky.app/profile/yuta256.bsky.social">
            <div>
              <div class="link-name">Bluesky</div>
              <div class="username">@yuta256.bsky.social</div>
            </div>

            <span class="arrow">↗</span>
          </a>

          <a class="link" href="https://www.reddit.com/user/yuta256dev/">
            <div>
              <div class="link-name">Reddit</div>
              <div class="username">u/yuta256dev</div>
            </div>

            <span class="arrow">↗</span>
          </a>
        </div>
      </section>

      <section>
        <h2>Development</h2>

        <div class="links">
          <a class="link" href="https://github.com/yutadev31">
            <div>
              <div class="link-name">GitHub</div>
              <div class="username">yutadev31</div>
            </div>

            <span class="arrow">↗</span>
          </a>

          <a class="link" href="https://gitlab.com/yuta31">
            <div>
              <div class="link-name">GitLab</div>
              <div class="username">yuta31</div>
            </div>

            <span class="arrow">↗</span>
          </a>

          <a class="link" href="https://codeberg.org/yutadev">
            <div>
              <div class="link-name">Codeberg</div>
              <div class="username">yutadev</div>
            </div>

            <span class="arrow">↗</span>
          </a>
        </div>
      </section>

      <section>
        <h2>Discord</h2>

        <div class="links">
          <div class="discord-account">
            <div>
              <div class="link-name">Discord</div>
              <div class="username">yuta256dev</div>
            </div>

            <button class="copy" data-username="yuta256dev">Copy</button>
          </div>

          <div class="discord-account">
            <div>
              <div class="link-name">Discord</div>
              <div class="username">yutadev31</div>
            </div>

            <button class="copy" data-username="yutadev31">Copy</button>
          </div>
        </div>
      </section>
    </main>

    <script>
      document.querySelectorAll(".copy").forEach((button) => {
        button.addEventListener("click", async () => {
          await navigator.clipboard.writeText(button.dataset.username);

          button.textContent = "Copied!";

          setTimeout(() => {
            button.textContent = "Copy";
          }, 1500);
        });
      });
    </script>
  </body>
</html>
